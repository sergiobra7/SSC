name: Build portable generator ZIP
on:
  push:
    paths:
      - index.html
      - .github/workflows/portable-zip.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package standalone generator
        shell: bash
        run: |
          mkdir -p downloads
          VERSION=$(grep -oE 'BİR.DUVARSESİ V[0-9]+\.[0-9]+\.[0-9]+' index.html | head -1 | awk '{print $2}')
          zip -j -9 "downloads/BIR_DUVARSESI_${VERSION}_BACKUP.zip" index.html
          echo "ZIP_PATH=downloads/BIR_DUVARSESI_${VERSION}_BACKUP.zip" >> "$GITHUB_ENV"
      - name: Save portable ZIP in repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ZIP_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "Package portable generator ZIP"
            git push
          fi
